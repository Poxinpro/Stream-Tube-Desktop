name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          
      - name: Install cargo-ferry
        run: cargo install cargo-ferry --version 0.1.0

      - name: Install NDK
        shell: bash
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat "ndk;29.0.13113456" "platforms;android-36" "build-tools;36.0.0"
          
      - name: Build
        working-directory: mobile/android
        run: pwsh -File tools/build-account-apk.ps1
          
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/android/target/google-play/*.apk
